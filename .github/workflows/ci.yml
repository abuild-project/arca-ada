name: Build and installation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trixie:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ARCA_BUILD_MODE: validation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the Trixie development image
        run: docker/dev/build
      - name: Check standalone coverage from a fresh checkout
        run: |
          test ! -e build
          docker/dev/run arca-dev:trixie make -j8 coverage NUM_CPUS=8
      - name: Check development wrapper arguments
        run: python3 tests/check-dev-wrappers.py
      - name: Check development shell and batch input
        run: python3 tests/check-dev-shell.py arca-dev:trixie
      - name: Build and check as the runner user
        run: docker/dev/run arca-dev:trixie make -j8 check NUM_CPUS=8
      - name: Preserve Ahven XML reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ahven-unit-results
          path: build/unit-results-*/*.xml
          if-no-files-found: ignore
